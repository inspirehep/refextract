name: Test Python 3

on:
  workflow_call:

jobs:
  lint_and_test:
      runs-on: ubuntu-latest
      strategy:
        matrix:
          python-version: ['3.11', '3.12', '3.13', '3.14']
      steps:
        - name: Checkout Code
          uses: actions/checkout@v7.0.1
          with:
            ref: ${{ github.ref }}
        - name: Lint - Pre-commit check
          if: matrix.python-version == '3.11'
          uses: pre-commit/action@v3.0.1
        - name: Prep Build
          uses: docker/setup-buildx-action@v4.4.1
        - name: Build Docker image
          run: >
            docker build
            --target refextract-tests
            --build-arg PYTHON_VERSION=${{ matrix.python-version }}
            -t refextract .
        - name: Run tests
          run: >
            docker run
            --entrypoint poetry
            refextract
            run pytest
